      <rect x="22" y="0" width="18" height="12" rx="2" fill="#ef4444" />
      <rect x="44" y="0" width="18" height="12" rx="2" fill="#10b981" />
      <rect x="66" y="0" width="18" height="12" rx="2" fill="#f59e0b" />
      <rect x="88" y="0" width="18" height="12" rx="2" fill="#3b82f6" />
      <rect x="110" y="0" width="18" height="12" rx="2" fill="#a855f7" />
      <rect x="132" y="0" width="18" height="12" rx="2" fill="#00f2fe" />
      <rect x="154" y="0" width="18" height="12" rx="2" fill="#f8fafc" />
    </g>

    <!-- Next Command Prompt with Active Blinking Cursor -->
    <text x="240" y="316">
      <tspan fill="#38bdf8" font-weight="bold">khoa@workstation</tspan><tspan fill="#64748b">:</tspan><tspan fill="#c084fc">~</tspan><tspan fill="#64748b">$</tspan> <tspan fill="#00f2fe" class="cursor-blink">█</tspan>
    </text>
