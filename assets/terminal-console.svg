    <line x1="60" y1="126" x2="74" y2="126" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="60" y1="140" x2="74" y2="140" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="60" y1="154" x2="74" y2="154" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="60" y1="168" x2="74" y2="168" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="60" y1="182" x2="74" y2="182" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />

    <line x1="144" y1="112" x2="158" y2="112" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="144" y1="126" x2="158" y2="126" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="144" y1="140" x2="158" y2="140" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="144" y1="154" x2="158" y2="154" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
