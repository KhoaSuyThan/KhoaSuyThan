    <line x1="88" y1="84" x2="88" y2="98" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="102" y1="84" x2="102" y2="98" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="116" y1="84" x2="116" y2="98" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="130" y1="84" x2="130" y2="98" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />

    <line x1="88" y1="198" x2="88" y2="212" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="102" y1="198" x2="102" y2="212" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="116" y1="198" x2="116" y2="212" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="130" y1="198" x2="130" y2="212" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />

