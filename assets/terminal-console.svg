    </text>
    <text x="240" y="222">
      <tspan fill="#00f2fe" font-weight="600">Featured  </tspan><tspan fill="#64748b">:&gt; </tspan><tspan fill="#00ff88">SmartCV AI Builder (smartcv-ai.io.vn)</tspan>
    </text>
    <text x="240" y="242">
      <tspan fill="#ec4899" font-weight="600">Status    </tspan><tspan fill="#64748b">:&gt; </tspan><tspan fill="#fef08a">Open for Software Engineering / Web &amp; AI Internship</tspan>
    </text>
