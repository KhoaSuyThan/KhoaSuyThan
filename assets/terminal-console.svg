<svg width="100%" height="100%" viewBox="0 0 950 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Font styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
      .term-code { font-family: 'Fira Code', monospace, Consolas, Courier; }
      .cursor-blink {
        animation: blink 1s step-start infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="termBgGrad" x1="0" y1="0" x2="950" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="950" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131c2e" />
      <stop offset="100%" stop-color="#0e1625" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="40" y1="90" x2="200" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Window Container -->
  <rect x="1" y="1" width="948" height="348" rx="10" fill="url(#termBgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Bar -->
  <path d="M 1 11 Q 1 1 11 1 L 939 1 Q 949 1 949 11 L 949 38 L 1 38 Z" fill="url(#headerGrad)" />
  <line x1="1" y1="38" x2="949" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- macOS Window Action Buttons -->
  <circle cx="22" cy="19" r="6" fill="#ff5f56" />
  <circle cx="42" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="19" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="475" y="24" text-anchor="middle" class="term-code" fill="#94a3b8" font-size="12" font-weight="500">khoa@workstation: ~ (zsh) — neofetch</text>

  <!-- Header Right Badge -->
  <rect x="850" y="8" width="82" height="22" rx="4" fill="#0b111e" stroke="#1e3a8a" stroke-width="0.8" />
  <text x="891" y="23" text-anchor="middle" class="term-code" fill="#38bdf8" font-size="10.5" font-weight="600">UTF-8 • zsh</text>

  <!-- Terminal Command Prompt -->
  <g class="term-code" font-size="12.5">
    <text x="35" y="65">
      <tspan fill="#38bdf8" font-weight="bold">khoa@workstation</tspan><tspan fill="#64748b">:</tspan><tspan fill="#c084fc">~</tspan><tspan fill="#64748b">$</tspan> <tspan fill="#facc15" font-weight="600">neofetch</tspan> <tspan fill="#94a3b8">--profile --smart-city</tspan>
    </text>
  </g>

