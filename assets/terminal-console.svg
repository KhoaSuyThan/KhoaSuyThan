    <path d="M 88 116 L 98 126 L 109 126 L 109 138" stroke="#00f2fe" stroke-width="1.2" fill="none" opacity="0.75" />
    <path d="M 130 116 L 120 126 L 109 126" stroke="#00f2fe" stroke-width="1.2" fill="none" opacity="0.75" />
    <path d="M 88 180 L 98 170 L 109 170 L 109 158" stroke="#c084fc" stroke-width="1.2" fill="none" opacity="0.75" />
